# XcodeGen project description. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
name: Soul
options:
  bundleIdPrefix: com.soulemu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.0"
targets:
  Soul:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Samples/**"
      - path: App/Samples
        type: folder
        buildPhase: resources
        optional: true
      - path: SoulCore/src
      - path: SoulCore/include
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: Soul
        PRODUCT_BUNDLE_IDENTIFIER: com.soulemu.Soul
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Soul.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: App/Soul-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/SoulCore/include
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
        GCC_C_LANGUAGE_STANDARD: gnu11
        GCC_OPTIMIZATION_LEVEL: "3"
        OTHER_CFLAGS: "-Wno-unused-parameter -Wno-deprecated-declarations -Wno-shorten-64-to-32 -Wno-comma"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
