name: Build

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: SoulCore tests (interpreter + ARM64 JIT)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 gcc-aarch64-linux-gnu qemu-user
      - name: Unit tests (inflate, MSI database; ASan)
        run: SoulCore/tests/unit/run_unit_tests.sh
      - name: Build soulrun (x86-64 host, interpreter)
        run: make -C SoulCore
      - name: Differential tests (interpreter)
        run: SoulCore/tests/run_tests.sh
      - name: Win32 / C++ / threads tests (interpreter)
        run: SoulCore/tests/win32/run_win32_tests.sh
      - name: GUI (windows, controls, dialogs) tests (interpreter)
        run: SoulCore/tests/gui/run_gui_tests.sh
      - name: Build soulrun (arm64, JIT)
        run: make -C SoulCore arm64
      - name: Differential tests (JIT under qemu-aarch64)
        run: SoulCore/tests/run_tests.sh qemu-aarch64 build/arm64/soulrun
      - name: Win32 / C++ / threads tests (JIT under qemu-aarch64)
        run: SoulCore/tests/win32/run_win32_tests.sh qemu-aarch64 ../../build/arm64/soulrun
      - name: GUI tests (JIT under qemu-aarch64)
        run: SoulCore/tests/gui/run_gui_tests.sh qemu-aarch64 build/arm64/soulrun
      - name: Windows Installer tests (msi.dll, msiexec wizard; interpreter + JIT)
        run: SoulCore/tests/msi/run_msi_tests.sh
      - name: Build sample Windows programs
        run: SoulCore/samples/build_samples.sh "$GITHUB_WORKSPACE/samples-out"
      - uses: actions/upload-artifact@v4
        with:
          name: samples
          path: samples-out/
      - name: Package the Windows test executables for the macOS GPU job
        run: |
          cd SoulCore
          # the executables the suites above built, the reference outputs of the differential tests, the msi
          # packages, and (when the shader translator wrote them) the generated Metal sources
          { find build/tests build/win32tests build/guitests \( -name '*.exe' -o -name '*.expected' -o -name '*.msi' \) -print0
            [ -d build/unit/sgsl_msl ] && find build/unit/sgsl_msl -type f -print0
            true; } > "$RUNNER_TEMP/prebuilt.list"
          tar czf "$GITHUB_WORKSPACE/prebuilt.tgz" --null -T "$RUNNER_TEMP/prebuilt.list"
          ls -la "$GITHUB_WORKSPACE/prebuilt.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tests
          path: prebuilt.tgz

  macos-gpu:
    name: macOS GPU tests
    runs-on: macos-15
    needs: core
    env:
      # the Windows test programs come from the Linux job (no MinGW here); the interpreter is used by default
      # (an ad-hoc signed CLI could use MAP_JIT, but the JIT is exercised by the Linux/qemu job and the simulator
      # job - what matters here is the GPU backend). The JIT step below is informational.
      SOUL_PREBUILT: "1"
      SOUL_NO_JIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: samples
          path: SoulCore/build/samples
      - uses: actions/download-artifact@v4
        with:
          name: windows-tests
          path: prebuilt
      - name: Unpack the prebuilt Windows test programs
        run: |
          tar xzf prebuilt/prebuilt.tgz -C SoulCore
          find SoulCore/build -name '*.exe' | wc -l
      - name: Machine
        run: |
          sw_vers; uname -m; xcodebuild -version || true
          system_profiler SPDisplaysDataType | head -20 || true
      - name: Build soulrun for macOS
        run: make -C SoulCore macos -j4
      - name: Backends in this binary
        run: |
          SoulCore/build/macos/soulrun --gpu-info
          SOUL_GPU=mirror SoulCore/build/macos/soulrun --gpu-info
          SOUL_GPU=metal SoulCore/build/macos/soulrun --gpu-info
      - name: Differential tests (interpreter, macOS)
        run: SoulCore/tests/run_tests.sh
      - name: Win32 / C++ / threads tests (interpreter, macOS)
        run: SoulCore/tests/win32/run_win32_tests.sh
      - name: GUI tests (CPU, exact pixels, macOS)
        run: SoulCore/tests/gui/run_gui_tests.sh
      - name: GPU tests, SOUL_GPU=metal (tolerance +-2) and frame rates
        run: |
          set -o pipefail
          SOUL_GPU=metal SOUL_PIXEL_TOLERANCE=2 GPU_BENCH_SECONDS=10 SoulCore/tests/gpu/run_gpu_tests.sh 2>&1 | tee gpu-metal.log
          { echo '### GPU frame rates (Metal vs CPU)'; echo '```'; sed -n '/--- frame rates/,/^gpu tests/p' gpu-metal.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: GPU tests, SOUL_GPU=mirror (exact)
        run: SOUL_GPU=mirror SOUL_PIXEL_TOLERANCE=0 GPU_BENCH=0 SoulCore/tests/gpu/run_gpu_tests.sh
      - name: Mirror backend over the whole win32 + GUI suites
        run: SoulCore/tests/gpu/run_mirror_tests.sh
      - name: Compile the generated Metal shaders
        run: |
          dir=SoulCore/build/unit/sgsl_msl
          if ! ls "$dir"/*.metal >/dev/null 2>&1; then
            echo "::notice::no generated Metal sources in $dir (shader translator not in this build yet), skipping"
            exit 0
          fi
          xcrun -sdk macosx metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain || true
          tmp=$(mktemp -d); bad=0; n=0
          for f in "$dir"/*.metal; do
            n=$((n+1))
            if ! xcrun -sdk macosx metal -c "$f" -o "$tmp/$(basename "$f").air" 2> "$tmp/err.txt"; then
              bad=$((bad+1)); echo "FAIL $f"; head -30 "$tmp/err.txt"
            fi
          done
          echo "metal: compiled $((n-bad)) of $n shaders"
          [ $bad -eq 0 ]
      - name: Differential tests with the JIT (informational)
        continue-on-error: true
        env:
          SOUL_NO_JIT: "0"
        run: SoulCore/tests/run_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-gpu-results
          path: |
            gpu-metal.log
            SoulCore/build/gputests/run/*.out
            SoulCore/build/gputests/run/*.err
            SoulCore/build/gputests/run/*.ppm

  ipa:
    name: iPad app (unsigned IPA)
    runs-on: macos-15
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: samples
          path: App/Samples
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Soul.xcodeproj -scheme Soul -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80
      - name: Package IPA (ad-hoc signed with entitlements)
        run: |
          mkdir -p Payload
          cp -R build/dd/Build/Products/Release-iphoneos/Soul.app Payload/
          codesign --force --sign - --entitlements App/Soul.entitlements --timestamp=none Payload/Soul.app
          codesign -d --entitlements :- Payload/Soul.app || true
          zip -qry Soul.ipa Payload
          ls -la Soul.ipa
          ls Payload/Soul.app/Samples
      - uses: actions/upload-artifact@v4
        with:
          name: Soul-ipa
          path: Soul.ipa
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Soul.ipa

  simulator:
    name: iPad simulator smoke test (real Apple Silicon JIT)
    runs-on: macos-15
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: samples
          path: App/Samples
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project Soul.xcodeproj -scheme Soul -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build | tail -n 20
          codesign --force --sign - build/sim/Build/Products/Release-iphonesimulator/Soul.app
      - name: Boot an iPad simulator
        run: |
          xcrun simctl list devicetypes | grep -i ipad || true
          TYPE=$(xcrun simctl list devicetypes | grep -i "iPad Air" | grep -i "M3" | head -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')
          [ -z "$TYPE" ] && TYPE=$(xcrun simctl list devicetypes | grep -i "iPad Air" | tail -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')
          [ -z "$TYPE" ] && TYPE=$(xcrun simctl list devicetypes | grep -i "iPad" | tail -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')
          RUNTIME=$(xcrun simctl list runtimes | grep -i "iOS" | tail -1 | sed -E 's/.* - (com\.apple[^ ]*).*/\1/')
          echo "device type: $TYPE  runtime: $RUNTIME"
          UDID=$(xcrun simctl create SoulTest "$TYPE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Run sample programs inside the app
        run: |
          xcrun simctl install "$UDID" build/sim/Build/Products/Release-iphonesimulator/Soul.app
          xcrun simctl launch "$UDID" com.soulemu.Soul -SoulAutoRun "Merhaba.exe,SistemBilgisi.exe,HesapMakinesi.exe,SayiTahmin.exe,CppDemo.exe,IsParcaciklari.exe,Benchmark.exe,Mandelbrot.exe,Saat.exe,HesapMakinesiGUI.exe,NotDefteri.exe,Cizim.exe,Yilan.exe,MayinTarlasi.exe,Kup3B.exe,Kup3BD3D9.exe,Benchmark32.exe,Kup3B32.exe"
          DATA=$(xcrun simctl get_app_container "$UDID" com.soulemu.Soul data)
          for i in $(seq 1 300); do [ -f "$DATA/Documents/Soul/autorun/done" ] && break; sleep 1; done
          mkdir -p sim-results
          cp -R "$DATA/Documents/Soul/autorun/." sim-results/ || true
          sleep 2
          xcrun simctl io "$UDID" screenshot sim-results/console.png
          xcrun simctl terminate "$UDID" com.soulemu.Soul || true
          xcrun simctl launch "$UDID" com.soulemu.Soul
          sleep 6
          xcrun simctl io "$UDID" screenshot sim-results/library.png
          xcrun simctl terminate "$UDID" com.soulemu.Soul || true
          rm -f "$DATA/Documents/Soul/autorun/done"
          xcrun simctl launch "$UDID" com.soulemu.Soul -SoulAutoRun "Kup3B.exe" -SoulAutoRunHold YES
          for i in $(seq 1 90); do [ -f "$DATA/Documents/Soul/autorun/done" ] && break; sleep 1; done
          sleep 2
          xcrun simctl io "$UDID" screenshot sim-results/gui.png
          for f in "$DATA"/Documents/Soul/autorun/*.exe.png; do [ -f "$f" ] && cp "$f" sim-results/; done
          echo "===== summary"; cat sim-results/summary.txt
          for f in sim-results/*.log; do echo "===== $f"; cat "$f"; done
          # pictures last (and small) so that the end of the log shows them
          for n in console library gui; do
            sips -Z 900 -s format jpeg -s formatOptions 35 "sim-results/$n.png" --out "sim-results/$n-small.jpg" >/dev/null
          done
          for n in library console gui; do
            echo "=====BEGIN $n.jpg"; base64 -i "sim-results/$n-small.jpg" | fold -w 8000; echo "=====END $n.jpg"
          done
          test -f sim-results/summary.txt
          ! grep -E "FAILED|TIMEOUT|MISSING" sim-results/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-results
          path: sim-results/
