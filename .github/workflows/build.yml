name: Build

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: SoulCore tests (interpreter + ARM64 JIT)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 gcc-aarch64-linux-gnu qemu-user
      - name: Build soulrun (x86-64 host, interpreter)
        run: make -C SoulCore
      - name: Differential tests (interpreter)
        run: SoulCore/tests/run_tests.sh
      - name: Build soulrun (arm64, JIT)
        run: make -C SoulCore arm64
      - name: Differential tests (JIT under qemu-aarch64)
        run: SoulCore/tests/run_tests.sh qemu-aarch64 build/arm64/soulrun
      - name: Build sample Windows programs
        run: SoulCore/samples/build_samples.sh "$GITHUB_WORKSPACE/samples-out"
      - uses: actions/upload-artifact@v4
        with:
          name: samples
          path: samples-out/

  ipa:
    name: iPad app (unsigned IPA)
    runs-on: macos-15
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: samples
          path: App/Samples
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Soul.xcodeproj -scheme Soul -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80
      - name: Package IPA (ad-hoc signed with entitlements)
        run: |
          mkdir -p Payload
          cp -R build/dd/Build/Products/Release-iphoneos/Soul.app Payload/
          codesign --force --sign - --entitlements App/Soul.entitlements --timestamp=none Payload/Soul.app
          codesign -d --entitlements :- Payload/Soul.app || true
          zip -qry Soul.ipa Payload
          ls -la Soul.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Soul-ipa
          path: Soul.ipa
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Soul.ipa
